  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      },
    );

    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;script&gt;
(() =&gt; {

  function enterMission(){if(stage!==3)return;const fields=[750,1250,1750];q(&#x27;#sun&#x27;).value=fields[Math.floor(Math.random()*fields.length)];missionLeafCount=2;missionBest=0;missionMode=true;root.classList.add(&#x27;mission-active&#x27;);q(&#x27;#missionTitle&#x27;).classList.remove(&#x27;locked&#x27;);q(&#x27;#missionField&#x27;).textContent=&#x27;この畑の条件：日射 &#x27;+q(&#x27;#sun&#x27;).value+&#x27; μmol photons m⁻² s⁻¹ ／ 葉の枚数 2 枚&#x27;;q(&#x27;#missionField&#x27;).classList.remove(&#x27;locked&#x27;);q(&#x27;#missionGoal&#x27;).classList.remove(&#x27;locked&#x27;);q(&#x27;#missionAction&#x27;).classList.remove(&#x27;locked&#x27;);q(&#x27;#missionResult&#x27;).classList.add(&#x27;locked&#x27;);q(&#x27;#sceneTitle&#x27;).textContent=&#x27;2枚の葉と重なり&#x27;;update();}
  const col=()=&gt;{const s=getComputedStyle(root);return {fg:s.getPropertyValue(&#x27;--foreground&#x27;).trim(),muted:s.getPropertyValue(&#x27;--muted-foreground&#x27;).trim(),border:s.getPropertyValue(&#x27;--border&#x27;).trim(),green:&#x27;#3f9b55&#x27;,yellow:&#x27;#f6c945&#x27;,orange:s.getPropertyValue(&#x27;--orange&#x27;).trim()};};
  const interp=x=&gt;{for(let i=1;i&lt;data.length;i++){if(x&lt;=data[i][0]){const [a,b]=data[i-1],[c,d]=data[i];return b+(d-b)*(x-a)/(c-a);}}return data.at(-1)[1];};
  function get(){return {angle:+q(&#x27;#angle&#x27;).value,sun:+q(&#x27;#sun&#x27;).value,spacing:+q(&#x27;#spacing&#x27;).value};}
  function calc(s){const projection=Math.cos(s.angle*Math.PI/180),direct=s.sun*projection,leafFactor=missionMode?missionLeafCount/3:1,cover=Math.min(1,(stage&gt;=3?1.2/(s.spacing/100):1)*projection*leafFactor),overlap=stage&gt;=3?Math.max(0,Math.min(1,(.525*projection-(.06+s.spacing/100*.30))/(.525*projection))):0;let shade=1;if(stage&gt;=3)shade=Math.max(.1,1-.58*cover);const light=Math.max(0,direct*shade);return {light,photo:interp(light),shade,cover,overlap};}
  function canopyPhoto(s){const p=Math.cos(s.angle*Math.PI/180),open=.5+.5*s.spacing/100,leafFactor=missionMode?missionLeafCount/3:1,top=s.sun*(.12+.88*p),middle=s.sun*2.1*p*(1-p)*open/leafFactor,bottom=s.sun*1.45*p*(1-p)*open/leafFactor;return leafFactor*(Math.max(0,interp(top))+Math.max(0,interp(middle))+Math.max(0,interp(bottom)));}
  function maxCanopyPhoto(sun){let best={value:-Infinity,angle:0,spacing:25};for(let angle=0;angle&lt;=80;angle++)for(let spacing=25;spacing&lt;=100;spacing+=5){const value=canopyPhoto({angle,sun,spacing});if(value&gt;best.value)best={value,angle,spacing};}return best;}
  function showResult(){const s=get(),r=calc(s),value=canopyPhoto(s),best=maxCanopyPhoto(s.sun),goal=best.value*.8,gap=best.value-value;missionBest=Math.max(missionBest,value);q(&#x27;#groupResult&#x27;).textContent=&#x27;群落全体の光合成量：&#x27;+value.toFixed(1);q(&#x27;#conditionResult&#x27;).textContent=&#x27;設定条件：葉の角度 &#x27;+s.angle+&#x27;° / 株間 &#x27;+s.spacing+&#x27; cm（葉の枚数 &#x27;+missionLeafCount+&#x27; 枚）&#x27;;q(&#x27;#leafResult&#x27;).textContent=&#x27;図の代表葉：受光 &#x27;+Math.round(r.light)+&#x27; μmol m⁻² s⁻¹ / 光合成速度 &#x27;+r.photo.toFixed(1)+&#x27; μmol CO₂ m⁻² s⁻¹（仮値）&#x27;;q(&#x27;#comparisonResult&#x27;).textContent=&#x27;最大値 &#x27;+best.value.toFixed(1)+&#x27;（葉角度 &#x27;+best.angle+&#x27;° / 株間 &#x27;+best.spacing+&#x27; cm）との差：&#x27;+Math.max(0,gap).toFixed(1);q(&#x27;#challengeResult&#x27;).textContent=value&gt;=goal?&#x27;クリア！ 目標 &#x27;+goal.toFixed(1)+&#x27; を達成&#x27;:&#x27;クリア条件：最大値の80%（&#x27;+goal.toFixed(1)+&#x27;）&#x27;;q(&#x27;#bestResult&#x27;).textContent=&#x27;この畑での自己ベスト：&#x27;+missionBest.toFixed(1);q(&#x27;#feedbackResult&#x27;).textContent=value&gt;=goal?&#x27;うまく光を分配できています。角度や株間を少し変えて、自己ベスト更新を狙ってみましょう。&#x27;:s.angle&lt;best.angle?&#x27;ヒント：葉をもう少し立てると、葉どうしの重なりを減らせるかもしれません。&#x27;:&#x27;ヒント：株間や葉の角度を少し戻し、光の受け方を比べてみましょう。&#x27;;q(&#x27;#missionResult&#x27;).classList.remove(&#x27;locked&#x27;);}
  function draw(s,r){
    const cn=q(&#x27;#scene&#x27;),box=cn.getBoundingClientRect(),d=devicePixelRatio||1,w=box.width,h=w*.75,ctx=cn.getContext(&#x27;2d&#x27;),c=col(),displayStage=missionMode?3:stage;
    if(Math.abs(box.height-h)&gt;1)cn.style.height=h+&#x27;px&#x27;;cn.width=Math.max(1,Math.round(w*d));cn.height=Math.max(1,Math.round(h*d));ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);

    const leaf=(x,dir=1,fill=c.green,stroke=&#x27;#246b38&#x27;)=&gt;{const ex=x+dir*dx*len,ey=base+dy*len,blade=Math.max(12,w*.038),px=-dy,py=dx;ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+dir*dx*len*.52+px*blade,base+dy*len*.52+py*blade,ex,ey);ctx.quadraticCurveTo(x+dir*dx*len*.52-px*blade,base+dy*len*.52-py*blade,x,base);ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1.2,w*.004);ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(ex,ey);ctx.stroke();};
    if(displayStage&gt;=3){const bright=&#x27;#c7efcf&#x27;,dark=&#x27;#08743a&#x27;,shade=Math.min(1,r.overlap*1.45),mix=(a,b,t)=&gt;{const aa=a.match(/\w\w/g).map(v=&gt;parseInt(v,16)),bb=b.match(/\w\w/g).map(v=&gt;parseInt(v,16));return &#x27;#&#x27;+aa.map((v,i)=&gt;Math.round(v+(bb[i]-v)*t).toString(16).padStart(2,&#x27;0&#x27;)).join(&#x27;&#x27;);},shaded=mix(bright,dark,shade);if(missionMode){const total=missionLeafCount,gap=Math.min(neighborGap,w*.18),middle=(total-1)/2;for(let i=0;i&lt;total;i++)leaf(center+(i-middle)*gap,i&lt;=middle?1:-1,i===0?bright:shaded,i===0?&#x27;#4c9c60&#x27;:&#x27;#07542b&#x27;);}else{const gap=Math.min(neighborGap,w*.28);leaf(center-gap/2,1,bright,&#x27;#4c9c60&#x27;);leaf(center+gap/2,-1,shaded,&#x27;#07542b&#x27;);}}else leaf(center);
    ctx.fillStyle=c.muted;ctx.font=&#x27;12px sans-serif&#x27;;ctx.fillText(&#x27;入射光 &#x27;+s.sun+&#x27; μmol photons m⁻² s⁻¹&#x27;,12,20);if(displayStage&gt;=3){ctx.fillText((missionMode?&#x27;葉 &#x27;+missionLeafCount+&#x27; 枚 / &#x27;:&#x27;隣接する2枚の葉 / &#x27;)+&#x27;重なり合い &#x27;+Math.round(r.overlap*100)+&#x27;% / 透過率 &#x27;+Math.round(r.shade*100)+&#x27;%&#x27;,12,37);ctx.fillStyle=&#x27;#c7efcf&#x27;;ctx.fillRect(12,45,10,10);ctx.fillStyle=c.muted;ctx.font=&#x27;10px sans-serif&#x27;;ctx.fillText(&#x27;よく受光&#x27;,26,54);ctx.fillStyle=&#x27;#08743a&#x27;;ctx.fillRect(82,45,10,10);ctx.fillStyle=c.muted;ctx.fillText(&#x27;重なりで減光&#x27;,96,54);}ctx.fillText(&#x27;葉の角度 &#x27;+s.angle+&#x27;°&#x27;,12,h-9);

  function curve(light,photo,s){const svg=q(&#x27;#curve&#x27;),rect=svg.getBoundingClientRect(),w=Math.max(280,rect.width),h=250,p={l:58,r:18,t:18,b:40},c=col(),groupStage=stage&gt;=3;
    if(groupStage){const values=Array.from({length:17},(_,i)=&gt;({angle:i*5,value:canopyPhoto({...s,angle:i*5})})),best=values.reduce((a,b)=&gt;a.value&gt;b.value?a:b),max=Math.ceil(best.value/5)*5,x=v=&gt;p.l+v/80*(w-p.l-p.r),y=v=&gt;p.t+(max-v)/max*(h-p.t-p.b),current=canopyPhoto(s);svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`);let m=&#x27;&#x27;;for(let i=0;i&lt;=80;i+=20)m+=`&lt;line x1=&quot;${x(i)}&quot; y1=&quot;${y(0)}&quot; x2=&quot;${x(i)}&quot; y2=&quot;${y(max)}&quot; stroke=&quot;${c.border}&quot;/&gt;&lt;text x=&quot;${x(i)}&quot; y=&quot;${h-18}&quot; text-anchor=&quot;middle&quot; fill=&quot;${c.muted}&quot;&gt;${i}°&lt;/text&gt;`;for(let i=0;i&lt;=max;i+=max/4)m+=`&lt;line x1=&quot;${x(0)}&quot; y1=&quot;${y(i)}&quot; x2=&quot;${x(80)}&quot; y2=&quot;${y(i)}&quot; stroke=&quot;${c.border}&quot;/&gt;&lt;text x=&quot;${p.l-8}&quot; y=&quot;${y(i)+4}&quot; text-anchor=&quot;end&quot; fill=&quot;${c.muted}&quot;&gt;${Math.round(i)}&lt;/text&gt;`;m+=`&lt;polyline points=&quot;${values.map(v=&gt;x(v.angle)+&#x27;,&#x27;+y(v.value)).join(&#x27; &#x27;)}&quot; fill=&quot;none&quot; stroke=&quot;${c.green}&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;${x(best.angle)}&quot; cy=&quot;${y(best.value)}&quot; r=&quot;4&quot; fill=&quot;${c.green}&quot;/&gt;&lt;text x=&quot;${x(best.angle)}&quot; y=&quot;${Math.max(13,y(best.value)-10)}&quot; text-anchor=&quot;middle&quot; fill=&quot;${c.fg}&quot;&gt;最大 ${best.value.toFixed(1)}（${best.angle}°）&lt;/text&gt;&lt;circle cx=&quot;${x(s.angle)}&quot; cy=&quot;${y(current)}&quot; r=&quot;6&quot; fill=&quot;${c.orange}&quot;&gt;&lt;title&gt;葉の角度 ${s.angle}°、群落全体の光合成量 ${current.toFixed(1)}&lt;/title&gt;&lt;/circle&gt;&lt;text class=&quot;axis-title&quot; data-axis=&quot;x&quot; x=&quot;${w/2}&quot; y=&quot;${h-3}&quot; text-anchor=&quot;middle&quot; fill=&quot;${c.fg}&quot;&gt;葉の角度（地表から）&lt;/text&gt;&lt;text class=&quot;axis-title&quot; data-axis=&quot;y&quot; transform=&quot;translate(14 ${h/2}) rotat       channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
